name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Configure AWS credentials
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 3. Login to ECR
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4. Build & Push Docker image
      - name: Build and Push
        run: |
          IMAGE_URI=541172291485.dkr.ecr.ap-south-1.amazonaws.com/mfp-backend:latest
          docker build -t $IMAGE_URI ./mfp_backend
          docker push $IMAGE_URI

      # 5. SSH into EC2 and deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/MFP
            docker pull 541172291485.dkr.ecr.ap-south-1.amazonaws.com/mfp-backend:latest
            docker compose --env-file .env.ec2 -f docker-compose.ecr.yml up -d
