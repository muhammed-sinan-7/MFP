services:
  web:
    image: ${ECR_BACKEND_IMAGE}
    container_name: mfp_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    env_file:
      - .env.ec2
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7
    container_name: mfp_redis
    volumes:
      - redis_data:/data
    restart: always

  celery:
    image: ${ECR_BACKEND_IMAGE}
    container_name: mfp_celery
    command: celery -A config worker -l info
    env_file:
      - .env.ec2
    depends_on:
      - redis
    restart: always

  celery_beat:
    image: ${ECR_BACKEND_IMAGE}
    container_name: mfp_celery_beat
    command: celery -A config beat -l info
    env_file:
      - .env.ec2
    depends_on:
      - redis
    restart: always

  flower:
    image: ${ECR_BACKEND_IMAGE}
    container_name: mfp_flower
    command: celery -A config flower --port=5555 --address=0.0.0.0
    env_file:
      - .env.ec2
    depends_on:
      - redis
      - celery
    restart: always

  nginx:
    image: nginx:latest
    container_name: mfp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./mfp_backend/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: always

  certbot:
    image: certbot/certbot
    container_name: mfp_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  redis_data:
  static_volume:
