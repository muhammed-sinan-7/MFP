services:
  web:
    ports:
      - "8000:8000"
    env_file:
      - .env
      - ./mfp_backend/.env.local

  celery:
    env_file:
      - .env
      - ./mfp_backend/.env.local

  celery_beat:
    env_file:
      - .env
      - ./mfp_backend/.env.local

  flower:
    ports:
      - "5555:5555"
    env_file:
      - .env
      - ./mfp_backend/.env.local

  nginx:
    profiles:
      - production-only

  certbot:
    profiles:
      - production-only
